# El sitio no se compila: es HTML, CSS y JS escritos a mano. Netlify sólo tiene
# que servir la carpeta SITE tal cual, igual que hace el workflow de Pages.
#
# command queda vacío a propósito. No hay package.json en la raíz, pero si algún
# día lo hay (tools/pdf.mjs ya usa playwright), Netlify intentaría "npm run
# build" por su cuenta y fallaría. Decirlo aquí evita esa sorpresa.
[build]
  publish = "SITE"
  command = ""

# Sin reglas de caché a la medida, y es deliberado: los archivos no llevan hash
# en el nombre —02-sup.jpg se llama igual antes y después de cambiar el render—
# así que un max-age largo serviría la foto vieja durante días. El comportamiento
# por defecto de Netlify (ETag y revalidación) es el correcto para este sitio.

# Aquí estaba un X-Robots-Tag: noindex, de cuando esta copia no era la casa. Ya
# lo es: hedmoncervantes.netlify.app es la dirección oficial, la que la propia
# página imprime en la ficha "Este sitio" y la que va en el CV. Un noindex ahora
# haría justo lo contrario de lo que se busca —dejar la dirección buena fuera de
# Google— así que se quita.
#
# El repositorio se sigue publicando también en GitHub Pages, y las dos copias
# son idénticas. Lo que evita que compitan es el <link rel="canonical"> del
# index.html, que nombra esta dirección: el rastreador llegue por donde llegue,
# acredita ésta. Un encabezado no serviría, porque Pages no sabe mandar
# encabezados; la etiqueta viaja dentro del archivo y funciona en las dos.
